<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cancelar reserva · Ankara Burger</title>
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <link rel="icon" href="favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="supabase-js.min.js"></script>
    <style>
        :root {
            --color-bg:      #0a0a0a;
            --color-surface: #141414;
            --color-primary: #C8A84B;
            --color-accent:  #E8891A;
            --color-text:    #F5F0E8;
            --color-muted:   #8A7E6E;
            --color-cancel:  #E53E3E;
            --font-display:  'Bebas Neue', sans-serif;
            --font-body:     'Inter', sans-serif;
        }
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: var(--color-bg); color: var(--color-text);
            font-family: var(--font-body); min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            padding: 24px;
        }
        .card {
            background: var(--color-surface);
            border: 1px solid rgba(200,168,75,0.15);
            border-radius: 8px;
            padding: 36px 28px;
            width: 100%; max-width: 400px;
            text-align: center;
        }
        .logo { width: 64px; height: 64px; border-radius: 50%; object-fit: cover; margin: 0 auto 16px; border: 2px solid rgba(200,168,75,0.3); }
        .brand { font-family: var(--font-display); font-size: 1.1rem; color: var(--color-primary); letter-spacing: 0.1em; margin-bottom: 28px; }
        .titulo { font-family: var(--font-display); font-size: 1.8rem; letter-spacing: 0.05em; margin-bottom: 8px; }
        .subtitulo { font-size: 0.85rem; color: var(--color-muted); margin-bottom: 28px; line-height: 1.6; }
        .detalle {
            background: rgba(200,168,75,0.05);
            border: 1px solid rgba(200,168,75,0.12);
            border-radius: 6px;
            padding: 18px;
            text-align: left;
            margin-bottom: 24px;
            display: flex; flex-direction: column; gap: 10px;
        }
        .detalle-row { display: flex; align-items: center; gap: 10px; font-size: 0.88rem; }
        .detalle-row i { color: var(--color-primary); width: 16px; text-align: center; }
        .detalle-row strong { color: var(--color-text); }
        .btn-cancelar {
            width: 100%; padding: 15px;
            background: var(--color-cancel); color: #fff;
            font-family: var(--font-display); font-size: 1.1rem; letter-spacing: 0.1em;
            border: none; border-radius: 4px; cursor: pointer;
            transition: opacity 0.2s;
            margin-bottom: 12px;
        }
        .btn-cancelar:hover { opacity: 0.85; }
        .btn-cancelar:disabled { opacity: 0.4; cursor: default; }
        .btn-volver {
            width: 100%; padding: 12px;
            background: none; color: var(--color-muted);
            font-family: var(--font-body); font-size: 0.85rem;
            border: 1px solid rgba(200,168,75,0.15); border-radius: 4px; cursor: pointer;
            transition: all 0.2s; text-decoration: none; display: block;
        }
        .btn-volver:hover { border-color: var(--color-primary); color: var(--color-primary); }
        .estado-icon { font-size: 3.5rem; margin-bottom: 16px; }
        .loading { color: var(--color-muted); font-size: 0.9rem; }
        .spinner { animation: spin 0.8s linear infinite; display: inline-block; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="card" id="card">
    <img src="logo-ankaraburger.png" alt="Ankara Burger" class="logo">
    <div class="brand">ANKARA BURGER</div>
    <p class="loading"><i class="fa-solid fa-circle-notch spinner"></i> Cargando reserva...</p>
</div>

<script>
    const SUPA_URL = 'https://evhxekevbgfeticrfcfh.supabase.co';
    const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV2aHhla2V2YmdmZXRpY3JmY2ZoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA0MjUwODMsImV4cCI6MjA5NjAwMTA4M30.ymbkuLe57GAv9vC8omi70erUTj7wMBo4TmlSuKBnqyU';
    const supa = supabase.createClient(SUPA_URL, SUPA_KEY, { auth: { persistSession: false } });

    const id = new URLSearchParams(window.location.search).get('id');
    const card = document.getElementById('card');

    function render(html) {
        card.innerHTML = `<img src="logo-ankaraburger.png" alt="Ankara Burger" class="logo"><div class="brand">ANKARA BURGER</div>${html}`;
    }

    async function init() {
        if (!id) { render('<div class="titulo">Enlace inválido</div><p class="subtitulo">Este enlace de cancelación no es válido.</p><a href="index.html" class="btn-volver">← Volver a la web</a>'); return; }

        const { data: rows, error } = await supa.rpc('get_reserva_publica', { p_id: id });
        const r = rows && rows[0];

        if (error || !r) { render('<div class="titulo">No encontrada</div><p class="subtitulo">No hemos encontrado esta reserva. Es posible que ya haya sido cancelada.</p><a href="index.html" class="btn-volver">← Volver a la web</a>'); return; }

        if (r.estado === 'cancelada') {
            render(`<div class="estado-icon">❌</div><div class="titulo">Ya cancelada</div><p class="subtitulo">Esta reserva ya fue cancelada anteriormente.</p><a href="index.html" class="btn-volver">← Volver a la web</a>`);
            return;
        }

        const hoy = new Date().toISOString().split('T')[0];
        if (r.fecha < hoy) {
            render(`<div class="estado-icon">⏰</div><div class="titulo">Reserva pasada</div><p class="subtitulo">Esta reserva ya ha pasado y no se puede cancelar.</p><a href="index.html" class="btn-volver">← Volver a la web</a>`);
            return;
        }

        const fechaFmt = new Date(r.fecha + 'T12:00:00').toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long' });
        const zonaLabel = { salon: 'Salón', terraza: 'Terraza', sin_preferencia: 'Sin preferencia' }[r.zona || 'sin_preferencia'];

        render(`
            <div class="titulo">Cancelar reserva</div>
            <p class="subtitulo">¿Seguro que quieres cancelar esta reserva?</p>
            <div class="detalle">
                <div class="detalle-row"><i class="fa-solid fa-user"></i><span><strong>${r.nombre}</strong></span></div>
                <div class="detalle-row"><i class="fa-solid fa-calendar"></i><span><strong>${fechaFmt}</strong></span></div>
                <div class="detalle-row"><i class="fa-solid fa-clock"></i><span><strong>${r.hora}</strong></span></div>
                <div class="detalle-row"><i class="fa-solid fa-users"></i><span><strong>${r.personas} personas</strong></span></div>
                <div class="detalle-row"><i class="fa-solid fa-location-dot"></i><span><strong>${zonaLabel}</strong></span></div>
            </div>
            <button class="btn-cancelar" id="btn-cancelar">
                <i class="fa-solid fa-circle-xmark"></i> SÍ, CANCELAR MI RESERVA
            </button>
            <a href="index.html" class="btn-volver">Mantener la reserva</a>
        `);

        document.getElementById('btn-cancelar').addEventListener('click', async () => {
            const btn = document.getElementById('btn-cancelar');
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-circle-notch spinner"></i> Cancelando...';
            await supa.rpc('cancelar_reserva', { p_id: id });
            render(`
                <div class="estado-icon">✅</div>
                <div class="titulo">Reserva cancelada</div>
                <p class="subtitulo">Tu reserva ha sido cancelada correctamente.<br>Esperamos verte pronto en Ankara Burger.</p>
                <a href="index.html" class="btn-volver">← Volver a la web</a>
            `);
        });
    }

    init();
</script>
</body>
</html>
